name: Update repository JSON files

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Europe/Zurich"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-repo-json
  cancel-in-progress: false

jobs:
  update-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download source repository
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --max-time 300 \
            "https://fastsign.dev/repo.json" \
            --output repo.download.json

      - name: Build repo.json and repo2.json
        run: |
          python3 <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          LIMIT = 2000
          source = Path("repo.download.json")

          with source.open("r", encoding="utf-8") as file:
              repo = json.load(file)

          if not isinstance(repo, dict):
              raise ValueError(
                  "Source JSON must contain a top-level object"
              )

          apps = repo.get("apps")

          if not isinstance(apps, list):
              raise ValueError(
                  'Source JSON must contain an "apps" array'
              )

          def bundle_id(app):
              value = app.get("bundleIdentifier")
              return value.strip() if isinstance(value, str) else ""

          def parse_date(value):
              if not isinstance(value, str):
                  return None

              value = value.strip()

              try:
                  return date.fromisoformat(value[:10])
              except ValueError:
                  return None

          def release_date(app):
              dates = []

              parsed = parse_date(app.get("versionDate"))

              if parsed:
                  dates.append(parsed)

              versions = app.get("versions")

              if isinstance(versions, list):
                  for version in versions:
                      if not isinstance(version, dict):
                          continue

                      parsed = parse_date(version.get("date"))

                      if parsed:
                          dates.append(parsed)

              full_date = app.get("fullDate")

              if isinstance(full_date, str) and len(full_date) >= 8:
                  parsed = parse_date(
                      f"{full_date[:4]}-"
                      f"{full_date[4:6]}-"
                      f"{full_date[6:8]}"
                  )

                  if parsed:
                      dates.append(parsed)

              return max(dates) if dates else None

          groups = {}
          first_apps = []

          for index, app in enumerate(apps):
              if not isinstance(app, dict):
                  continue

              identifier = bundle_id(app)

              if not identifier:
                  continue

              groups.setdefault(identifier, []).append(
                  (index, app)
              )

              # repo.json keeps the first occurrence.
              if len(groups[identifier]) == 1:
                  first_apps.append(app)

          second_apps = []

          for entries in groups.values():
              # A second-newest app does not exist when there
              # is only one occurrence of the bundle ID.
              if len(entries) < 2:
                  continue

              def sort_key(entry):
                  index, app = entry
                  app_date = release_date(app)

                  # Valid dates first, newest to oldest.
                  # Original source order breaks date ties.
                  return (
                      app_date is None,
                      -(app_date.toordinal() if app_date else 0),
                      index,
                  )

              ranked = sorted(entries, key=sort_key)
              second_apps.append(ranked[1])

          # Preserve source order after selecting each
          # bundle ID's second-newest occurrence.
          second_apps.sort(key=lambda entry: entry[0])

          repo1 = dict(repo)
          repo1["apps"] = first_apps[:LIMIT]

          repo2 = dict(repo)
          repo2["apps"] = [
              app for _, app in second_apps[:LIMIT]
          ]

          outputs = (
              (Path("repo.filtered.json"), repo1),
              (Path("repo2.filtered.json"), repo2),
          )

          for path, data in outputs:
              with path.open("w", encoding="utf-8") as file:
                  json.dump(
                      data,
                      file,
                      ensure_ascii=False,
                  )

          print(
              f"repo.json: {len(repo1['apps'])} apps; "
              f"repo2.json: {len(repo2['apps'])} apps"
          )
          PY

          rm -f repo.download.json

      - name: Minify JSON files
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          files = (
              ("repo.filtered.json", "repo.json"),
              ("repo2.filtered.json", "repo2.json"),
          )

          for source_name, output_name in files:
              source = Path(source_name)
              output = Path(output_name)
              temporary = output.with_suffix(
                  output.suffix + ".tmp"
              )

              with source.open("r", encoding="utf-8") as file:
                  data = json.load(file)

              with temporary.open(
                  "w",
                  encoding="utf-8",
                  newline="\n",
              ) as file:
                  json.dump(
                      data,
                      file,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  )
                  file.write("\n")

              os.replace(temporary, output)
              source.unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo.json repo2.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: update repository JSON files"
          git push origin HEAD:main
